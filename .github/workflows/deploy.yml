name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Sync search data (_data -> data)
        run: python3 scripts/sync_search_data.py

      - name: Assert search-data sync
        run: python3 scripts/test_search_sync.py

      # The topic layer is eight pages of quotation drawn from the recovered
      # material, and every quotation is attributed to a file and a line. If one
      # of those attributions is wrong, the published page puts words in a living
      # person's mouth, which is the one failure this archive cannot afford - and
      # nothing else in the pipeline would notice. test_quotes.py re-reads each
      # cited file and fails the build if a quote is not there, word for word, at
      # the line it claims.
      - name: Assert every topic quotation is real
        run: python3 scripts/test_quotes.py

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      # Regression guard for the 2026-09-27 P0. `exclude: - data/` in
      # _config.yml deleted all four client-side search indexes from _site/
      # while every gate stayed green - test_search_sync.py above proves the
      # _data -> data half and never looks at what Jekyll kept - and /search/
      # then rendered "Failed to load search data" for every visitor. The
      # existing steps cannot see that failure; this one can. It asserts the
      # built output, so any future Jekyll-side regression in the data/ pipeline
      # fails here rather than in production.
      - name: Assert search data reached the build
        run: |
          missing=0
          for f in papers videos canonical_works blog_posts; do
            if [ ! -f "_site/data/$f.json" ]; then
              echo "MISSING _site/data/$f.json"
              missing=1
            elif python3 -c "import json,sys; json.load(open(sys.argv[1], encoding='utf-8'))" "_site/data/$f.json"; then
              echo "ok _site/data/$f.json"
            else
              echo "INVALID JSON _site/data/$f.json"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::the data/ search index was not published - check the exclude: list in _config.yml"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # IndexNow (https://www.indexnow.org): tell participating engines that these
      # URLs changed, so they re-crawl on this deploy instead of on their next
      # scheduled visit. Ownership is proved by the key file at the site root, not
      # by an account - which matters here because the site is on a `github.io`
      # subpath, where Search Console and Bing Webmaster Tools are the only other
      # routes and both require an account the site owner does not have.
      #
      # Three things this step needs, and the first version of it had neither:
      #   * a checkout. The `deploy` job gets only the Pages artifact, so the
      #     script was not in the workspace and python3 exited 127. The earlier
      #     `git checkout main -- scripts/...` that papered over this was itself
      #     failing silently, so the ping looked like it ran when it never did.
      #   * the built sitemap, which the script reads for its URL list. The
      #     `build` job's `_site/` is gone by now, so the list is downloaded from
      #     the deployed sitemap instead - which is also the more correct source,
      #     being the URLs that are actually live.
      #   * a visible failure. `continue-on-error: true` on its own made every
      #     failure mode indistinguishable from success: two commits (ff287c8,
      #     bde1333) were spent discovering the step "looked like it ran when it
      #     never did". The wrapper below emits ::warning:: on any non-zero exit
      #     so that can never be silent again.
      #
      # This step now calls scripts/ping_indexnow.py rather than carrying its own
      # inline copy of the protocol. That removes the second implementation that
      # had drifted, and it removes three hardcoded occurrences of the host and
      # base path: the script derives both from `url:` and `baseurl:` in
      # _config.yml, so they cannot disagree with what the build used.
      #
      # Deliberately NOT fatal: a failed ping must never fail or roll back a
      # successful deployment.
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Ping IndexNow
        id: indexnow
        continue-on-error: true
        env:
          # The URL GitHub Pages actually deployed to. Deriving the sitemap from
          # this rather than a literal means a repo rename, an org page move or a
          # changed base path can never leave the ping POSTing to a host that no
          # longer serves these URLs.
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -uo pipefail
          sitemap_url="${PAGE_URL%/}/sitemap.xml"
          echo "sitemap: $sitemap_url"
          if ! curl -fsSL -o sitemap.xml "$sitemap_url"; then
            echo "::warning::could not download the deployed sitemap from $sitemap_url; nothing was submitted to IndexNow"
            exit 0
          fi
          rc=0
          python3 scripts/ping_indexnow.py --sitemap sitemap.xml || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning::IndexNow submission failed (exit $rc). The deployment itself succeeded; participating engines will fall back to their own crawl schedule."
          fi
          exit 0
