name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Sync search data (_data -> data)
        run: python3 scripts/sync_search_data.py

      - name: Assert search-data sync
        run: python3 scripts/test_search_sync.py

      # All five suites, as far as a public clone can actually run them.
      #
      # test_transcripts.py is deliberately NOT here, and that is a decision
      # rather than an oversight. It re-derives all 68 published transcripts from
      # the WebVTT captures, and checks the redaction by looking for the withheld
      # identifier itself - but the identifier lives in `.redaction.local.json`,
      # which is gitignored, and three of the captures holding it are gitignored
      # too. A public clone has neither, so there is nothing for the test to
      # compare against and it fails on all three redacted documents. Wiring it
      # up "green" would mean a guard that guards nothing. It runs locally and
      # must keep running there; the gitignore comment on those files is the
      # record of why it cannot run here.
      - name: Assert counts and collection integrity
        run: python3 scripts/test_canonical_57.py

      - name: Assert nothing broken or leaking in the rendered pages
        run: python3 scripts/test_no_junk.py

      # The topic layer is eight pages of quotation drawn from the recovered
      # material, and every quotation is attributed to a file and a line. If one
      # of those attributions is wrong, the published page puts words in a living
      # person's mouth, which is the one failure this archive cannot afford - and
      # nothing else in the pipeline would notice. test_quotes.py re-reads each
      # cited file and fails the build if a quote is not there, word for word, at
      # the line it claims. It also enforces the byline gate: material bylined to
      # someone else must never be rendered as the subject's words.
      - name: Assert every topic quotation is real and correctly attributed
        run: python3 scripts/test_quotes.py

      # The SearchAction in jsonld.html is a claim about /search/, held in a
      # different file from the code that has to honour it. Nothing else in the
      # repository referenced either half, so for the life of the node a
      # consumer following the query template landed on a live search page that
      # ignored the parameter - no error, no results, and nothing to tell it
      # apart from a site with nothing to find.
      - name: Assert the SearchAction query template is one the search honours
        run: python3 scripts/check_search_action.py

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      # The sitemap is a promise: these URLs exist, come and read them. Until
      # 2026-09-29 two of the 355 were 404s, because jekyll-sitemap pipes every
      # URL through `| xml_escape` and the entity `&apos;` is correct XML and
      # the wrong URL - a legacy permalink contains a raw apostrophe, and the
      # real page is at `%27` and was in no sitemap at all. Nothing above can
      # see this: every other gate runs BEFORE the build and reads the source
      # tree, and the sitemap only exists afterwards.
      - name: Assert the sitemap advertises only URLs that were built
        run: python3 scripts/check_sitemap.py

      # Assert the RENDERED page, and refuse to report on a stale _site.
      #
      # Two defects only visible after a build, both found in the same pass:
      #
      # 1. Five layouts rendered `page.display_title` with no fallback. That
      #    key is written to the four GENERATED collections and to nothing
      #    else, so all 54 _posts pages rendered an EMPTY <h1>. The pages
      #    still looked finished, because the recovered WordPress export
      #    carries its own <h1> in the body - the title was visible one
      #    heading level down and the document outline began with nothing.
      #
      # 2. 273 of 314 meta descriptions were cut mid-word, because
      #    `truncate: 160, ""` cuts at a character index.
      #
      # The staleness guard in the script is the point of putting it here. A
      # `jekyll build` that fails on a Liquid error exits 1 and leaves the
      # previous _site untouched, so a post-build gate reading _site will
      # happily report the PREVIOUS build's numbers - as clean - over a site
      # that was never built. That happened during this work: three runs
      # printed "0 problem(s)" while every build was failing on a stray
      # `endfor`. The gate now fails rather than answer.
      - name: Assert the rendered pages, and that they are not stale
        run: python3 scripts/check_built_pages.py


    # Regression guard for the 2026-09-27 P0. `exclude: - data/` in
    # _config.yml deleted all four client-side search indexes from _site/
    # while every gate stayed green - test_search_sync.py above proves the
    # _data -> data half and never looks at what Jekyll kept - and /search/
    # then rendered "Failed to load search data" for every visitor. The
    # existing steps cannot see that failure; this one can. It asserts the
    # built output, so any future Jekyll-side regression in the data/ pipeline
    # fails here rather than in production.
      - name: Assert search data reached the build
        run: |
          missing=0
          for f in papers videos canonical_works blog_posts; do
            if [ ! -f "_site/data/$f.json" ]; then
              echo "MISSING _site/data/$f.json"
              missing=1
            elif python3 -c "import json,sys; json.load(open(sys.argv[1], encoding='utf-8'))" "_site/data/$f.json"; then
              echo "ok _site/data/$f.json"
            else
              echo "INVALID JSON _site/data/$f.json"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::the data/ search index was not published - check the exclude: list in _config.yml"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # IndexNow (https://www.indexnow.org): tell participating engines that these
      # URLs changed, so they re-crawl on this deploy instead of on their next
      # scheduled visit. Ownership is proved by the key file at the site root, not
      # by an account - which matters here because the site is on a `github.io`
      # subpath, where Search Console and Bing Webmaster Tools are the only other
      # routes and both require an account the site owner does not have.
      #
      # Three things this step needs, and the first version of it had neither:
      #   * a checkout. The `deploy` job gets only the Pages artifact, so the
      #     script was not in the workspace and python3 exited 127. The earlier
      #     `git checkout main -- scripts/...` that papered over this was itself
      #     failing silently, so the ping looked like it ran when it never did.
      #   * the built sitemap, which the script reads for its URL list. The
      #     `build` job's `_site/` is gone by now, so the list is downloaded from
      #     the deployed sitemap instead - which is also the more correct source,
      #     being the URLs that are actually live.
      #   * a visible failure. `continue-on-error: true` on its own made every
      #     failure mode indistinguishable from success: two commits (ff287c8,
      #     bde1333) were spent discovering the step "looked like it ran when it
      #     never did". The wrapper below emits ::warning:: on any non-zero exit
      #     so that can never be silent again.
      #
      # This step now calls scripts/ping_indexnow.py rather than carrying its own
      # inline copy of the protocol. That removes the second implementation that
      # had drifted, and it removes three hardcoded occurrences of the host and
      # base path: the script derives both from `url:` and `baseurl:` in
      # _config.yml, so they cannot disagree with what the build used.
      #
      # Deliberately NOT fatal: a failed ping must never fail or roll back a
      # successful deployment.
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Ping IndexNow
        id: indexnow
        continue-on-error: true
        env:
          # The URL GitHub Pages actually deployed to. Deriving the sitemap from
          # this rather than a literal means a repo rename, an org page move or a
          # changed base path can never leave the ping POSTing to a host that no
          # longer serves these URLs.
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -uo pipefail
          sitemap_url="${PAGE_URL%/}/sitemap.xml"
          echo "sitemap: $sitemap_url"
          if ! curl -fsSL -o sitemap.xml "$sitemap_url"; then
            echo "::warning::could not download the deployed sitemap from $sitemap_url; nothing was submitted to IndexNow"
            exit 0
          fi
          rc=0
          python3 scripts/ping_indexnow.py --sitemap sitemap.xml || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning::IndexNow submission failed (exit $rc). The deployment itself succeeded; participating engines will fall back to their own crawl schedule."
          fi
          exit 0
